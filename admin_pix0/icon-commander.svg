<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0a0c10"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9f0a"/>
      <stop offset="100%" stop-color="#ff453a"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff"/>
      <stop offset="100%" stop-color="#0a84ff"/>
    </linearGradient>
  </defs>
  <!-- Background squircle -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)"/>
  <rect width="500" height="500" x="6" y="6" rx="114" fill="none" stroke="url(#accentGrad)" stroke-width="8" opacity="0.6"/>
  
  <!-- Radar circles -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#00d2ff" stroke-width="4" stroke-dasharray="8 8" opacity="0.3"/>
  <circle cx="256" cy="256" r="120" fill="none" stroke="#00d2ff" stroke-width="4" opacity="0.25"/>
  <circle cx="256" cy="256" r="60" fill="none" stroke="#00d2ff" stroke-width="4" opacity="0.4"/>
  
  <!-- Satellite / Radar Dish Icon -->
  <g transform="translate(256, 256) scale(1.1)">
    <!-- Satellite dish curve -->
    <path d="M-90,60 C-60,-80 60,-80 90,60" fill="none" stroke="url(#accentGrad)" stroke-width="22" stroke-linecap="round"/>
    <!-- Feed horn arm -->
    <line x1="0" y1="20" x2="0" y2="-100" stroke="#f0f6fc" stroke-width="14" stroke-linecap="round"/>
    <!-- Signal emitter ball -->
    <circle cx="0" cy="-105" r="18" fill="url(#accentGrad)"/>
    <!-- Base stand -->
    <path d="M-40,110 L0,50 L40,110" fill="none" stroke="#8b949e" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Pulsing wave beams -->
    <path d="M-60,-135 C-30,-160 30,-160 60,-135" fill="none" stroke="url(#cyanGrad)" stroke-width="10" stroke-linecap="round"/>
    <path d="M-90,-165 C-45,-200 45,-200 90,-165" fill="none" stroke="url(#cyanGrad)" stroke-width="8" stroke-linecap="round" opacity="0.7"/>
  </g>
</svg>
