<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4361ee" />
      <stop offset="100%" stop-color="#3a0ca3" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#4361ee" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Maskable (Full Bleed) -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" />

  <!-- Display Outer Bezel -->
  <rect x="76" y="76" width="360" height="360" rx="36" fill="#1c1f26" stroke="#2e3340" stroke-width="8" filter="url(#glow)" />

  <!-- LCD Screen Area -->
  <rect x="100" y="100" width="312" height="312" rx="20" fill="#0f172a" />

  <!-- Palette Icon & Drawing Wave inside Screen -->
  <circle cx="210" cy="210" r="32" fill="#ef476f" />
  <circle cx="280" cy="180" r="28" fill="#ffd166" />
  <circle cx="330" cy="240" r="24" fill="#06d6a0" />
  <circle cx="290" cy="310" r="30" fill="#4361ee" />
  <circle cx="200" cy="290" r="26" fill="#7209b7" />

  <!-- Stylized Pencil / Brush Tip -->
  <path d="M 370 120 L 400 150 L 260 290 L 220 300 L 230 260 Z" fill="#ffffff" opacity="0.9" />
  <polygon points="220,300 235,275 245,285" fill="#f77f00" />
</svg>
